<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Conecta Comunidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow border-0">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <h1 class="h3 text-primary mb-1">Conecta Comunidade</h1>
            <p class="text-muted mb-0">Organize e participe de ações comunitárias</p>
          </div>
          <div id="alert" class="alert d-none" role="alert"></div>
          <form id="formLogin" autocomplete="off">
            <div class="mb-3">
              <label class="form-label" for="email">E-mail</label>
              <input type="email" class="form-control" id="email" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="senha">Senha</label>
              <input type="password" class="form-control" id="senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
          </form>
          <hr>
          <p class="text-center small mb-0">
            Ainda não tem conta?
            <a href="cadastro.html">Cadastre-se</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  if (Auth.getToken()) location.href = 'painel.html';

  const params = new URLSearchParams(location.search);
  if (params.get('ok') === '1') {
    showAlert(document.getElementById('alert'), 'Conta criada com sucesso! Faça login para continuar.', 'success');
  }

  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alert = document.getElementById('alert');
    try {
      const data = await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          senha: document.getElementById('senha').value
        })
      });
      Auth.setSession(data);
      location.href = 'painel.html';
    } catch (err) {
      showAlert(alert, err.message, 'danger');
    }
  });
</script>
</body>
</html>
