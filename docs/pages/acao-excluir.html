<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excluir ação - Conecta Comunidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="../painel.html">Conecta Comunidade</a>
  </div>
</nav>
<main class="container py-4">
  <h1 class="h3 mb-3">Excluir ação</h1>
  <div id="alert" class="alert d-none"></div>
  <div class="card border-danger shadow-sm"><div class="card-body" id="box">Carregando…</div></div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  if (!Auth.requireLogin()) throw new Error('redirect');
  const id = new URLSearchParams(location.search).get('id');

  (async () => {
    const a = await api('/api/acoes/' + id);
    if (!a.souDono) {
      alert('Você só pode excluir ações criadas por você.');
      location.href = 'acao-detalhe.html?id=' + id;
      return;
    }
    document.getElementById('box').innerHTML = `
      <p>Tem certeza de que deseja excluir a ação abaixo?</p>
      <ul>
        <li><strong>Título:</strong> ${escapeHtml(a.titulo)}</li>
        <li><strong>Data:</strong> ${formatDateBr(a.data)}</li>
        <li><strong>Categoria:</strong> ${escapeHtml(a.categoria)}</li>
        <li><strong>Status:</strong> ${escapeHtml(a.status)}</li>
      </ul>
      <div class="d-flex gap-2">
        <button class="btn btn-danger" id="btnExcluir">Sim, excluir</button>
        <a class="btn btn-outline-secondary" href="acao-detalhe.html?id=${id}">Cancelar</a>
      </div>`;
    document.getElementById('btnExcluir').onclick = async () => {
      try {
        const r = await api('/api/acoes/' + id, { method: 'DELETE' });
        sessionStorage.setItem('flash', r.mensagem);
        location.href = '../painel.html';
      } catch (e) {
        showAlert(document.getElementById('alert'), e.message, 'danger');
      }
    };
  })().catch(e => showAlert(document.getElementById('alert'), e.message, 'danger'));
</script>
</body>
</html>
