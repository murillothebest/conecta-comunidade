<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ação - Conecta Comunidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="../painel.html">Conecta Comunidade</a>
    <a class="btn btn-outline-light btn-sm" href="../painel.html">Voltar</a>
  </div>
</nav>
<main class="container py-4">
  <h1 class="h3 mb-3" id="tituloPagina">Cadastrar ação</h1>
  <div id="alert" class="alert d-none"></div>
  <div class="card shadow-sm"><div class="card-body">
    <form id="form" class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Título</label>
        <input class="form-control" id="titulo" required minlength="3">
      </div>
      <div class="col-md-4">
        <label class="form-label">Data</label>
        <input type="date" class="form-control" id="data" required>
      </div>
      <div class="col-12">
        <label class="form-label">Descrição</label>
        <textarea class="form-control" id="descricao" rows="4" required></textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label">Local</label>
        <input class="form-control" id="local" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Categoria</label>
        <select class="form-select" id="idCategoria" required></select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Status</label>
        <select class="form-select" id="status">
          <option>Planejada</option>
          <option>Em andamento</option>
          <option>Concluída</option>
          <option>Cancelada</option>
        </select>
      </div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-outline-secondary" href="../painel.html">Cancelar</a>
      </div>
    </form>
  </div></div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  if (!Auth.requireLogin()) throw new Error('redirect');
  const id = new URLSearchParams(location.search).get('id');
  const editando = !!id;
  if (editando) document.getElementById('tituloPagina').textContent = 'Editar ação';

  (async () => {
    const cats = await api('/api/categorias');
    document.getElementById('idCategoria').innerHTML =
      '<option value="">Selecione...</option>' +
      cats.map(c => `<option value="${c.idCategoria}">${escapeHtml(c.nome)}</option>`).join('');

    if (editando) {
      const a = await api('/api/acoes/' + id);
      if (!a.souDono) {
        alert('Você só pode editar ações criadas por você.');
        location.href = 'acao-detalhe.html?id=' + id;
        return;
      }
      document.getElementById('titulo').value = a.titulo;
      document.getElementById('descricao').value = a.descricao;
      document.getElementById('data').value = a.data.substring(0, 10);
      document.getElementById('local').value = a.local;
      document.getElementById('status').value = a.status;
      document.getElementById('idCategoria').value = a.idCategoria;
    }
  })().catch(e => showAlert(document.getElementById('alert'), e.message, 'danger'));

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      titulo: document.getElementById('titulo').value.trim(),
      descricao: document.getElementById('descricao').value.trim(),
      data: document.getElementById('data').value,
      local: document.getElementById('local').value.trim(),
      status: document.getElementById('status').value,
      idCategoria: Number(document.getElementById('idCategoria').value)
    };
    try {
      if (editando) {
        const r = await api('/api/acoes/' + id, { method: 'PUT', body: JSON.stringify(body) });
        sessionStorage.setItem('flash', r.mensagem);
        location.href = 'acao-detalhe.html?id=' + id;
      } else {
        const r = await api('/api/acoes', { method: 'POST', body: JSON.stringify(body) });
        sessionStorage.setItem('flash', r.mensagem);
        location.href = 'acao-detalhe.html?id=' + r.idAcao;
      }
    } catch (err) {
      showAlert(document.getElementById('alert'), err.message, 'danger');
    }
  });
</script>
</body>
</html>
