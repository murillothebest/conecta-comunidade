<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel - Conecta Comunidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="painel.html">Conecta Comunidade</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="painel.html">Início</a></li>
        <li class="nav-item"><a class="nav-link" href="pages/acoes.html">Ações</a></li>
        <li class="nav-item"><a class="nav-link" href="pages/usuarios.html">Usuários</a></li>
      </ul>
      <span class="navbar-text text-white me-3" id="navUser"></span>
      <button class="btn btn-outline-light btn-sm" id="btnSair">Sair</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div id="flash" class="alert d-none"></div>

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <div>
      <h1 class="h3 mb-1">Ações da comunidade</h1>
      <p class="text-muted mb-0">Veja, participe e organize mutirões, campanhas e atividades</p>
    </div>
    <a href="pages/acao-form.html" class="btn btn-primary">Criar ação</a>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-sm-6 col-lg-3">
      <div class="card card-stat h-100"><div class="card-body">
        <div class="text-muted small">Ações disponíveis</div>
        <div class="display-6" id="statAcoes">0</div>
      </div></div>
    </div>
    <div class="col-sm-6 col-lg-3">
      <div class="card card-stat h-100"><div class="card-body">
        <div class="text-muted small">Minhas participações</div>
        <div class="display-6" id="statInscricoes">0</div>
      </div></div>
    </div>
  </div>

  <div id="listaCards" class="row g-3"></div>
</main>

<footer class="py-3 mt-auto">
  <div class="container text-center text-muted small">
    Conecta Comunidade — Projeto acadêmico — Tema: Comunidade
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  if (!Auth.requireLogin()) throw new Error('redirect');

  const user = Auth.getUser();
  document.getElementById('navUser').textContent = 'Olá, ' + (user?.nome || '');
  document.getElementById('btnSair').onclick = () => { Auth.clear(); location.href = 'login.html'; };

  const flashMsg = sessionStorage.getItem('flash');
  if (flashMsg) {
    showAlert(document.getElementById('flash'), flashMsg, 'success');
    sessionStorage.removeItem('flash');
  }

  async function participar(id) {
    try {
      const r = await api('/api/acoes/' + id + '/participar', { method: 'POST' });
      sessionStorage.setItem('flash', r.mensagem || 'Inscrição realizada com sucesso!');
      location.reload();
    } catch (err) {
      showAlert(document.getElementById('flash'), err.message, 'danger');
    }
  }

  async function cancelar(id) {
    try {
      const r = await api('/api/acoes/' + id + '/participar', { method: 'DELETE' });
      sessionStorage.setItem('flash', r.mensagem || 'Participação cancelada.');
      location.reload();
    } catch (err) {
      showAlert(document.getElementById('flash'), err.message, 'danger');
    }
  }

  window.participar = participar;
  window.cancelar = cancelar;

  (async () => {
    try {
      const acoes = await api('/api/acoes');
      document.getElementById('statAcoes').textContent = acoes.length;
      document.getElementById('statInscricoes').textContent = acoes.filter(a => a.usuarioInscrito).length;

      const box = document.getElementById('listaCards');
      if (!acoes.length) {
        box.innerHTML = '<div class="col-12"><div class="alert alert-info">Nenhuma ação ainda. <a href="pages/acao-form.html">Crie a primeira</a>.</div></div>';
        return;
      }

      box.innerHTML = acoes.map(a => `
        <div class="col-md-6 col-xl-4">
          <div class="card action-card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between mb-2 gap-2">
                <span class="badge text-bg-light border">${escapeHtml(a.categoria)}</span>
                <span class="badge ${statusClass(a.status)}">${escapeHtml(a.status)}</span>
              </div>
              <h2 class="h5">${escapeHtml(a.titulo)}</h2>
              <p class="text-muted flex-grow-1">${escapeHtml(resumir(a.descricao))}</p>
              <ul class="list-unstyled small text-muted mb-3">
                <li><strong>Data:</strong> ${formatDateBr(a.data)}</li>
                <li><strong>Local:</strong> ${escapeHtml(a.local)}</li>
                <li><strong>Participantes:</strong> ${a.totalParticipantes}</li>
              </ul>
              <div class="d-flex flex-wrap gap-2 mt-auto">
                <a class="btn btn-outline-secondary btn-sm" href="pages/acao-detalhe.html?id=${a.idAcao}">Ver detalhes</a>
                ${a.usuarioInscrito
                  ? `<button class="btn btn-outline-danger btn-sm" onclick="cancelar(${a.idAcao})">Cancelar participação</button>`
                  : `<button class="btn btn-primary btn-sm" onclick="participar(${a.idAcao})">Participar</button>`}
                ${a.souDono ? `<a class="btn btn-link btn-sm px-1" href="pages/acao-form.html?id=${a.idAcao}">Editar</a>` : ''}
              </div>
            </div>
          </div>
        </div>`).join('');
    } catch (err) {
      showAlert(document.getElementById('flash'), err.message, 'danger');
    }
  })();
</script>
</body>
</html>
