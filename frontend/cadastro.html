<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastre-se - Conecta Comunidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100 py-4">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <h1 class="h3 text-primary mb-1">Cadastre-se</h1>
            <p class="text-muted mb-0">Crie sua conta para participar da comunidade</p>
          </div>
          <div id="alert" class="alert d-none" role="alert"></div>
          <form id="formCadastro" autocomplete="off">
            <div class="mb-3">
              <label class="form-label" for="nome">Nome</label>
              <input type="text" class="form-control" id="nome" required minlength="3" autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">E-mail</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="senha">Senha</label>
              <input type="password" class="form-control" id="senha" required minlength="6">
              <div class="form-text">Mínimo de 6 caracteres.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="senha2">Confirmar senha</label>
              <input type="password" class="form-control" id="senha2" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100">Criar conta</button>
          </form>
          <hr>
          <p class="text-center small mb-0">
            Já tem conta? <a href="login.html">Entrar</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById('formCadastro').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alert = document.getElementById('alert');
    const senha = document.getElementById('senha').value;
    const senha2 = document.getElementById('senha2').value;
    if (senha !== senha2) {
      showAlert(alert, 'A confirmação de senha não confere.', 'danger');
      return;
    }
    try {
      await api('/api/auth/cadastro', {
        method: 'POST',
        body: JSON.stringify({
          nome: document.getElementById('nome').value.trim(),
          email: document.getElementById('email').value.trim(),
          senha
        })
      });
      location.href = 'login.html?ok=1';
    } catch (err) {
      showAlert(alert, err.message, 'danger');
    }
  });
</script>
</body>
</html>
