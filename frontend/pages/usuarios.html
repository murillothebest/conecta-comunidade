<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários - Conecta Comunidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="../painel.html">Conecta Comunidade</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="../painel.html">Início</a>
      <a class="nav-link" href="acoes.html">Ações</a>
      <a class="nav-link active" href="usuarios.html">Usuários</a>
    </div>
  </div>
</nav>
<main class="container py-4">
  <div class="d-flex justify-content-between mb-3">
    <h1 class="h3 mb-0">Usuários</h1>
    <a class="btn btn-primary" href="usuario-form.html">Novo usuário</a>
  </div>
  <div id="alert" class="alert d-none"></div>
  <div class="card shadow-sm"><div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Cadastro</th><th></th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div></div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  if (!Auth.requireLogin()) throw new Error('redirect');

  async function carregar() {
    const lista = await api('/api/usuarios');
    document.getElementById('tbody').innerHTML = lista.map(u => `
      <tr>
        <td>${u.idUsuario}</td>
        <td>${escapeHtml(u.nome)}</td>
        <td>${escapeHtml(u.email)}</td>
        <td>${new Date(u.dataCadastro).toLocaleString('pt-BR')}</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-primary" href="usuario-form.html?id=${u.idUsuario}">Editar</a>
          <button class="btn btn-sm btn-outline-danger" onclick="excluir(${u.idUsuario}, '${escapeHtml(u.nome)}')">Excluir</button>
        </td>
      </tr>`).join('');
  }

  window.excluir = async (id, nome) => {
    if (!confirm('Excluir o usuário "' + nome + '"?')) return;
    try {
      const r = await api('/api/usuarios/' + id, { method: 'DELETE' });
      showAlert(document.getElementById('alert'), r.mensagem, 'success');
      await carregar();
    } catch (e) {
      showAlert(document.getElementById('alert'), e.message, 'danger');
    }
  };

  carregar().catch(e => showAlert(document.getElementById('alert'), e.message, 'danger'));
</script>
</body>
</html>
