<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhe da ação - Conecta Comunidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="../painel.html">Conecta Comunidade</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="navbar-text text-white" id="navUser"></span>
      <a class="btn btn-outline-light btn-sm" href="../painel.html">Início</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div id="flash" class="alert d-none"></div>
  <div id="conteudo">Carregando…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  if (!Auth.requireLogin()) throw new Error('redirect');
  document.getElementById('navUser').textContent = 'Olá, ' + (Auth.getUser()?.nome || '');

  const id = new URLSearchParams(location.search).get('id');
  if (!id) location.href = '../painel.html';

  async function participar() {
    try {
      const r = await api('/api/acoes/' + id + '/participar', { method: 'POST' });
      sessionStorage.setItem('flash', r.mensagem);
      location.reload();
    } catch (e) {
      showAlert(document.getElementById('flash'), e.message, 'danger');
    }
  }

  async function cancelar() {
    try {
      const r = await api('/api/acoes/' + id + '/participar', { method: 'DELETE' });
      sessionStorage.setItem('flash', r.mensagem);
      location.reload();
    } catch (e) {
      showAlert(document.getElementById('flash'), e.message, 'danger');
    }
  }

  window.participar = participar;
  window.cancelar = cancelar;

  const flashMsg = sessionStorage.getItem('flash');
  if (flashMsg) {
    showAlert(document.getElementById('flash'), flashMsg, 'success');
    sessionStorage.removeItem('flash');
  }

  (async () => {
    try {
      const a = await api('/api/acoes/' + id);
      const participantes = (a.participantes || []).map(p => `
        <li class="list-group-item">
          <div class="fw-semibold">${escapeHtml(p.nome)}</div>
          <div class="small text-muted">${escapeHtml(p.email)}</div>
        </li>`).join('') || '<li class="list-group-item text-muted">Nenhum participante ainda.</li>';

      document.getElementById('conteudo').innerHTML = `
        <div class="d-flex flex-wrap justify-content-between gap-2 mb-4">
          <div>
            <h1 class="h3 mb-1">${escapeHtml(a.titulo)}</h1>
            <p class="text-muted mb-0">Detalhes da ação comunitária</p>
          </div>
          <div class="d-flex flex-wrap gap-2">
            ${a.usuarioInscrito
              ? `<button class="btn btn-outline-danger" onclick="cancelar()">Cancelar participação</button>`
              : `<button class="btn btn-primary" onclick="participar()">Participar da ação</button>`}
            ${a.souDono ? `
              <a class="btn btn-outline-primary" href="acao-form.html?id=${a.idAcao}">Editar</a>
              <a class="btn btn-outline-danger" href="acao-excluir.html?id=${a.idAcao}">Excluir</a>` : ''}
            <a class="btn btn-outline-secondary" href="../painel.html">Voltar</a>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-lg-8">
            <div class="card shadow-sm mb-3"><div class="card-body">
              <h2 class="h5">Descrição</h2>
              <p class="mb-0">${escapeHtml(a.descricao).replace(/\n/g, '<br>')}</p>
            </div></div>
          </div>
          <div class="col-lg-4">
            <div class="card shadow-sm mb-3"><div class="card-body">
              <dl class="mb-0">
                <dt>Status</dt><dd><span class="badge ${statusClass(a.status)}">${escapeHtml(a.status)}</span></dd>
                <dt>Data</dt><dd>${formatDateBr(a.data)}</dd>
                <dt>Local</dt><dd>${escapeHtml(a.local)}</dd>
                <dt>Categoria</dt><dd>${escapeHtml(a.categoria)}</dd>
                <dt>Organizador</dt><dd>${escapeHtml(a.organizador)}<br><span class="small text-muted">${escapeHtml(a.emailOrganizador)}</span></dd>
                <dt>Participantes</dt><dd class="fs-4 fw-semibold text-primary mb-0">${a.totalParticipantes}</dd>
              </dl>
            </div></div>
            <div class="card shadow-sm">
              <div class="card-header bg-white"><strong>Lista de participantes (${a.totalParticipantes})</strong></div>
              <ul class="list-group list-group-flush">${participantes}</ul>
            </div>
          </div>
        </div>`;
    } catch (e) {
      showAlert(document.getElementById('flash'), e.message, 'danger');
    }
  })();
</script>
</body>
</html>
