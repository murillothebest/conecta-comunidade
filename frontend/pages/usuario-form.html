<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuário - Conecta Comunidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="../painel.html">Conecta Comunidade</a>
    <a class="btn btn-outline-light btn-sm" href="usuarios.html">Voltar</a>
  </div>
</nav>
<main class="container py-4">
  <h1 class="h3 mb-3" id="titulo">Cadastrar usuário</h1>
  <div id="alert" class="alert d-none"></div>
  <div class="card shadow-sm"><div class="card-body">
    <form id="form" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nome</label>
        <input class="form-control" id="nome" required minlength="3">
      </div>
      <div class="col-md-6">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" id="lblSenha">Senha</label>
        <input type="password" class="form-control" id="senha" minlength="6">
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-outline-secondary" href="usuarios.html">Cancelar</a>
      </div>
    </form>
  </div></div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  if (!Auth.requireLogin()) throw new Error('redirect');
  const id = new URLSearchParams(location.search).get('id');
  const editando = !!id;
  if (editando) {
    document.getElementById('titulo').textContent = 'Editar usuário';
    document.getElementById('lblSenha').textContent = 'Nova senha (opcional)';
  } else {
    document.getElementById('senha').required = true;
  }

  (async () => {
    if (!editando) return;
    const u = await api('/api/usuarios/' + id);
    document.getElementById('nome').value = u.nome;
    document.getElementById('email').value = u.email;
  })().catch(e => showAlert(document.getElementById('alert'), e.message, 'danger'));

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      nome: document.getElementById('nome').value.trim(),
      email: document.getElementById('email').value.trim(),
      senha: document.getElementById('senha').value || null
    };
    try {
      const r = editando
        ? await api('/api/usuarios/' + id, { method: 'PUT', body: JSON.stringify(body) })
        : await api('/api/usuarios', { method: 'POST', body: JSON.stringify(body) });
      sessionStorage.setItem('flash', r.mensagem);
      location.href = 'usuarios.html';
    } catch (err) {
      showAlert(document.getElementById('alert'), err.message, 'danger');
    }
  });
</script>
</body>
</html>
